name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build sandbox runner
        run: cargo build -p kl-sandbox --bins
      - name: Rust tests
        run: cargo test --workspace
      - name: Rust build
        run: cargo build --workspace
      - name: .NET build
        run: dotnet build kl.sln
      - name: .NET tests
        run: dotnet test kl.sln --no-build
      - name: Windows end-to-end demo
        shell: pwsh
        run: ./scripts/demo-e2e.ps1
      - name: Windows policy demo
        shell: pwsh
        run: ./scripts/demo-policy.ps1
      - name: Windows plugin hot-upgrade demo
        shell: pwsh
        run: ./scripts/demo-plugin.ps1

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Check bubblewrap
        run: bwrap --version
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build sandbox runner
        run: cargo build -p kl-sandbox --bins
      - name: Rust tests
        run: cargo test --workspace
      - name: OS sandbox integration
        env:
          KL_REQUIRE_OS_SANDBOX: "1"
        run: cargo test -p kl-sandbox --test os_sandbox -- --nocapture
      - name: Rust build
        run: cargo build --workspace
      - name: .NET build
        run: dotnet build kl.sln
      - name: .NET tests
        run: dotnet test kl.sln --no-build

  macos:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build sandbox runner
        run: cargo build -p kl-sandbox --bins
      - name: Rust tests
        run: cargo test --workspace
      - name: OS sandbox integration
        env:
          KL_REQUIRE_OS_SANDBOX: "1"
        run: cargo test -p kl-sandbox --test os_sandbox -- --nocapture
      - name: Rust build
        run: cargo build --workspace
      - name: .NET build
        run: dotnet build kl.sln
      - name: .NET tests
        run: dotnet test kl.sln --no-build
