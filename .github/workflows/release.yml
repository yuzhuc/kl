name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Resolve release tag
        shell: bash
        run: |
          version="$(awk '/^\[workspace.package\]/{found=1; next} found && /^version *=/{gsub(/[" ]/, "", $3); print $3; exit}' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "cannot read workspace version from Cargo.toml" >&2
            exit 1
          fi
          tag="v${version}-rs${GITHUB_RUN_NUMBER}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Create tag at this commit
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"

  windows:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            rust: x86_64-pc-windows-msvc
            msvc_arch: amd64
          - rid: win-x86
            rust: i686-pc-windows-msvc
            msvc_arch: x86
          - rid: win-arm64
            rust: aarch64-pc-windows-msvc
            msvc_arch: amd64_arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.rid }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - if: matrix.rid == 'win-arm64'
        run: choco install llvm -y --no-progress
      - if: matrix.rid == 'win-arm64'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"
      - name: Package
        run: node scripts/package.mjs --rid ${{ matrix.rid }} --rust-target ${{ matrix.rust }}
      - name: Verify package
        run: node scripts/verify-package.mjs --rid ${{ matrix.rid }}
      - if: matrix.rid == 'win-x64' || matrix.rid == 'win-x86'
        name: Smoke test
        run: dist\${{ matrix.rid }}\kl.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: kl-${{ matrix.rid }}
          path: dist/kl-${{ matrix.rid }}.*
          if-no-files-found: error

  linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            rust: x86_64-unknown-linux-musl
          - rid: linux-arm64
            rust: aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.rid }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: true
          cache-key: ${{ matrix.rid }}
      - name: Install cargo-zigbuild
        run: |
          if ! command -v cargo-zigbuild >/dev/null 2>&1; then
            cargo install cargo-zigbuild --locked
          fi
      - name: Package
        run: node scripts/package.mjs --rid ${{ matrix.rid }} --rust-target ${{ matrix.rust }} --zig
      - name: Verify package
        run: node scripts/verify-package.mjs --rid ${{ matrix.rid }}
      - if: matrix.rid == 'linux-x64'
        name: Smoke test
        run: dist/${{ matrix.rid }}/kl --version
      - uses: actions/upload-artifact@v4
        with:
          name: kl-${{ matrix.rid }}
          path: dist/kl-${{ matrix.rid }}.*
          if-no-files-found: error

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rid: osx-x64
            rust: x86_64-apple-darwin
          - os: macos-14
            rid: osx-arm64
            rust: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.rid }}
      - name: Package
        run: node scripts/package.mjs --rid ${{ matrix.rid }} --rust-target ${{ matrix.rust }}
      - name: Verify package
        run: node scripts/verify-package.mjs --rid ${{ matrix.rid }}
      - if: matrix.rid == 'osx-arm64'
        name: Smoke test
        run: dist/${{ matrix.rid }}/kl --version
      - uses: actions/upload-artifact@v4
        with:
          name: kl-${{ matrix.rid }}
          path: dist/kl-${{ matrix.rid }}.*
          if-no-files-found: error

  publish:
    if: needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success'
    needs: [prepare, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*

  cleanup:
    needs: [prepare, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete old releases
        shell: bash
        run: |
          set -euo pipefail
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [ "$tag" = "${TARGET_TAG}" ]; then
              echo "keep release $tag"
            else
              echo "delete release $tag"
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done
      - name: Delete old release tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git tag --list 'v*' | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [ "$tag" = "${TARGET_TAG}" ]; then
              continue
            fi
            echo "delete tag $tag"
            git push origin "refs/tags/$tag" --delete || true
          done
