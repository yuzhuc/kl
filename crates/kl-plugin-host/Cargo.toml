[package]
name = "kl-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "KL sidecar plugin manifest, supervisor and adapters"

[dependencies]
kl-policy = { path = "../kl-policy" }
kl-provider = { path = "../kl-provider" }
kl-tools = { path = "../kl-tools" }
kl-sandbox = { path = "../kl-sandbox" }
kl-exec = { path = "../kl-exec" }
base64 = "0.22"
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
dunce = "1"
wasmtime = { version = "36.0.19", default-features = false, features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
    "wat",
] }

[dev-dependencies]
tempfile = "3"
