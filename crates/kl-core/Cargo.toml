[package]
name = "kl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "KL trusted core process"

[lib]
name = "kl_core"
path = "src/lib.rs"

[[bin]]
name = "kl-core"
path = "src/main.rs"

[dependencies]
kl-protocol = { path = "../kl-protocol" }
kl-agent = { path = "../kl-agent" }
kl-audit = { path = "../kl-audit" }
kl-policy = { path = "../kl-policy" }
kl-provider = { path = "../kl-provider" }
kl-store = { path = "../kl-store" }
kl-tools = { path = "../kl-tools" }
kl-sandbox = { path = "../kl-sandbox" }
kl-plugin-host = { path = "../kl-plugin-host" }
kl-review = { path = "../kl-review" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
dunce = "1"

[dev-dependencies]
tempfile = "3"
