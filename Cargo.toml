[workspace]
resolver = "3"
members = [
    "crates/kl-protocol",
    "crates/kl-policy",
    "crates/kl-audit",
    "crates/kl-store",
    "crates/kl-exec",
    "crates/kl-sandbox",
    "crates/kl-plugin-host",
    "crates/kl-provider",
    "crates/kl-tools",
    "crates/kl-agent",
    "crates/kl-review",
    "crates/kl-core",
    "crates/kl-index",
]
exclude = ["vendor/ureq"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.86"

# ureq 2.12.1 only accepts vulnerable webpki-roots 0.26; keep its API
# while forwarding TLS roots to the fixed 1.0.10 release.
[patch.crates-io]
ureq = { path = "vendor/ureq" }

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
