[workspace]
resolver = "3"
members = [
    "crates/kl-protocol",
    "crates/kl-policy",
    "crates/kl-audit",
    "crates/kl-store",
    "crates/kl-exec",
    "crates/kl-sandbox",
    "crates/kl-plugin-host",
    "crates/kl-provider",
    "crates/kl-tools",
    "crates/kl-agent",
    "crates/kl-review",
    "crates/kl-core",
    "crates/kl-index",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
